<!DOCTYPE html>
<html>
<head>

<title>AWS DevOps Demo</title>

<style>

body{
font-family: Arial;
background:#f4f6f8;
text-align:center;
}

.container{
width:700px;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h1{
color:#2c3e50;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#3498db;
color:white;
}

.footer{
margin-top:20px;
color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>Flask DevOps Demo 🚀</h1>

<p><b>Server Hostname:</b> {{hostname}}</p>
<p><b>Current Time:</b> {{time}}</p>

<h3>Team Members</h3>

<table>

<tr>
<th>Name</th>
<th>Role</th>
</tr>

{% for user in users %}
<tr>
<td>{{user.name}}</td>
<td>{{user.role}}</td>
</tr>
{% endfor %}

</table>

<div class="footer">

<p>Application Build using AWS CodeBuild</p>

</div>

</div>

</body>
</html>
